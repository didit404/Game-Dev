<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Nusa - Boss Battle</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121218;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #222;
        }

        /* Kontainer Utama Game (800x600) */
        #game-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            border: 6px solid #2b2b36;
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            background-color: #1e1b2e;
            image-rendering: pixelated;
        }

        /* ================= AREA PERTARUNGAN (ATAS) ================= */
        #battle-arena {
            position: relative;
            flex: 1; /* Mengambil sisa ruang di atas panel dialog */
            background: linear-gradient(180deg, #1b1630 0%, #3a2d5c 55%, #5c4b7d 100%);
            overflow: hidden;
        }

        /* Efek pusaran badai halus di latar belakang */
        #storm-bg {
            position: absolute;
            top: -50%;
            left: 10%;
            width: 650px;
            height: 650px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 65%);
            border: 4px dashed rgba(255, 255, 255, 0.06);
            animation: spinStorm 35s linear infinite;
            pointer-events: none;
        }

        @keyframes spinStorm {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Platform Berpijak Ala Pokemon */
        .platform {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, #5b7a52 0%, #3a5234 70%, #263822 100%);
            border: 4px solid #7fa374;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.45);
        }

        #boss-platform {
            width: 260px;
            height: 75px;
            top: 175px;
            right: 55px;
            z-index: 2;
        }

        #player-platform {
            width: 280px;
            height: 80px;
            bottom: -15px;
            left: 40px;
            z-index: 2;
        }

        /* ================= SPRITE KARAKTER ================= */
        #boss-container {
            position: absolute;
            top: 25px;
            right: 80px;
            width: 200px;
            height: 200px;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            animation: bossHover 3s ease-in-out infinite;
        }

        #boss-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.6));
            transition: transform 0.2s, filter 0.2s;
        }

        #player-container {
            position: absolute;
            bottom: 10px;
            left: 85px;
            width: 190px;
            height: 190px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #player-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.6));
            transition: transform 0.2s;
        }

        @keyframes bossHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ================= KOTAK STATUS HP (HUD) ================= */
        .hud-box {
            position: absolute;
            width: 300px;
            background-color: #f8f5e6;
            border: 4px solid #333;
            border-radius: 10px 4px 10px 4px;
            padding: 12px 14px;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
            z-index: 10;
        }

        #boss-hud {
            top: 22px;
            left: 24px;
        }

        #player-hud {
            bottom: 22px;
            right: 24px;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
            color: #222;
        }

        .hp-bar-container {
            display: flex;
            align-items: center;
            background-color: #333;
            border-radius: 6px;
            padding: 3px 5px;
            gap: 6px;
        }

        .hp-label {
            color: #f1c40f;
            font-size: 9px;
            font-weight: bold;
        }

        .hp-track {
            flex: 1;
            height: 12px;
            background-color: #555;
            border-radius: 3px;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            width: 100%;
            background-color: #2ecc71;
            transition: width 0.35s ease, background-color 0.35s ease;
        }

        #player-hp-text {
            text-align: right;
            font-size: 10px;
            margin-top: 6px;
            color: #333;
        }

        /* ================= PANEL DIALOG & KUIS (BAWAH) ================= */
        #dialog-panel {
            height: 195px;
            background-color: #f8f5e6;
            border-top: 6px solid #c0392b;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 15;
            box-shadow: inset 0 0 0 4px #333;
        }

        #dialog-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        #question-text {
            font-size: 11px;
            line-height: 1.6;
            color: #222;
            flex: 1;
        }

        #timer-box {
            background-color: #222;
            color: #ffea00;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            min-width: 48px;
            text-align: center;
        }

        #options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .option-btn {
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 6px;
            padding: 10px 12px 10px 24px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: #222;
            cursor: pointer;
            text-align: left;
            position: relative;
            transition: background-color 0.15s;
        }

        .option-btn:hover {
            background-color: #ffeaa7;
        }

        .option-btn:hover::before {
            content: '▶';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #c0392b;
            font-size: 10px;
        }

        /* ================= EFEK ANIMASI SERANGAN ================= */
        #effects-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 12;
        }

        .slash {
            position: absolute;
            top: 100px;
            right: 110px;
            width: 150px;
            height: 14px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 12px #00f3ff, 0 0 24px #fff;
            transform: rotate(-45deg) scale(0);
            opacity: 0;
        }

        .slash-active { animation: slashAnim 0.35s ease-out; }
        @keyframes slashAnim {
            0% { opacity: 1; transform: rotate(-45deg) scale(0.2); }
            50% { opacity: 1; transform: rotate(-45deg) scale(1.2); }
            100% { opacity: 0; transform: rotate(-45deg) scale(1.5); }
        }

        .ultimate {
            position: absolute;
            bottom: 80px;
            left: 170px;
            width: 520px;
            height: 45px;
            background: linear-gradient(180deg, #fff, #ffea00, #ff5500, #fff);
            box-shadow: 0 0 25px #ffea00, 0 0 50px #ff5500;
            border-radius: 20px;
            transform-origin: left center;
            transform: rotate(-28deg) scaleX(0);
            opacity: 0;
        }

        .ultimate-active { animation: ultiAnim 1.6s ease-out; }
        @keyframes ultiAnim {
            0% { opacity: 1; transform: rotate(-28deg) scaleX(0); }
            20% { opacity: 1; transform: rotate(-28deg) scaleX(1); }
            80% { opacity: 1; transform: rotate(-28deg) scaleX(1); }
            100% { opacity: 0; transform: rotate(-28deg) scaleX(1.1); }
        }

        .player-attack { animation: lunge 0.3s ease-out; }
        @keyframes lunge {
            0% { transform: translate(0, 0); }
            50% { transform: translate(45px, -20px); }
            100% { transform: translate(0, 0); }
        }

        .shake { animation: shakeAnim 0.3s linear; }
        @keyframes shakeAnim {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-6px, 4px); }
            50% { transform: translate(6px, -4px); }
            75% { transform: translate(-4px, -4px); }
        }

        .damage-flash { animation: flashRed 0.35s ease; }
        @keyframes flashRed {
            0% { filter: sepia(100%) hue-rotate(-50deg) saturate(400%); }
            100% { filter: none; }
        }

        /* ================= OVERLAY START / GAME OVER ================= */
        #overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(15, 12, 24, 0.92);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            z-index: 30;
        }

        #overlay-title {
            font-size: 20px;
            color: #ffea00;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        #overlay-desc {
            font-size: 11px;
            color: #ddd;
            line-height: 1.8;
            max-width: 560px;
            margin-bottom: 28px;
        }

        .start-btn {
            background-color: #e74c3c;
            color: #fff;
            border: 4px solid #fff;
            padding: 14px 28px;
            font-family: 'Press Start 2P', cursive;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 6px 0 #96281b;
        }

        .start-btn:hover { background-color: #ff5e4d; }
        .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #96281b; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- AREA PERTARUNGAN -->
        <div id="battle-arena">
            <div id="storm-bg"></div>

            <!-- Platform -->
            <div class="platform" id="boss-platform"></div>
            <div class="platform" id="player-platform"></div>

            <!-- HUD BOSS (Kiri Atas) -->
            <div class="hud-box" id="boss-hud">
                <div class="hud-header">
                    <span>KALA CORRUPTUS</span>
                    <span>Lv.99</span>
                </div>
                <div class="hp-bar-container">
                    <span class="hp-label">HP</span>
                    <div class="hp-track">
                        <div class="hp-fill" id="boss-hp-fill"></div>
                    </div>
                </div>
            </div>

            <!-- SPRITE BOSS (Kanan Atas) -->
            <div id="boss-container">
                <img id="boss-img" src="boss-removebg-preview.png" alt="Kala Corruptus" onerror="this.onerror=null; this.src='boss.png';">
            </div>

            <!-- SPRITE PLAYER (Kiri Bawah) -->
            <div id="player-container">
                <img id="player-img" src="player-removebg-preview.png" alt="Pahlawan Waktu" onerror="this.onerror=null; this.src='player.png';">
            </div>

            <!-- HUD PLAYER (Kanan Bawah) -->
            <div class="hud-box" id="player-hud">
                <div class="hud-header">
                    <span>PAHLAWAN WAKTU</span>
                </div>
                <div class="hp-bar-container">
                    <span class="hp-label">HP</span>
                    <div class="hp-track">
                        <div class="hp-fill" id="player-hp-fill"></div>
                    </div>
                </div>
                <div id="player-hp-text">100/100</div>
            </div>

            <!-- EFEK SERANGAN -->
            <div id="effects-layer">
                <div class="slash" id="slash-fx"></div>
                <div class="ultimate" id="ulti-fx"></div>
            </div>
        </div>

        <!-- PANEL DIALOG & KUIS (BAWAH) -->
        <div id="dialog-panel">
            <div id="dialog-top">
                <p id="question-text">Memuat pertempuran sejarah...</p>
                <div id="timer-box">10</div>
            </div>
            <div id="options-grid"></div>
        </div>

        <!-- OVERLAY MULAI / SELESAI -->
        <div id="overlay-screen">
            <h1 id="overlay-title">KALA CORRUPTUS MENGHADANG!</h1>
            <p id="overlay-desc">Jawab pertanyaan sejarah Indonesia dengan benar untuk menyerang dan kalahkan Kala Corruptus sebelum garis waktu runtuh!</p>
            <button class="start-btn" id="start-btn" onclick="startGame()">MULAI BATTLE!</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "Kerajaan maritim Buddha terbesar di Nusantara yang menguasai Selat Malaka adalah...", options: ["Tarumanegara", "Sriwijaya", "Majapahit", "Singasari"], answer: 1 },
            { q: "Pahlawan wanita asal Aceh yang gigih melawan penjajah Belanda dengan taktik gerilya adalah...", options: ["R.A. Kartini", "Cut Nyak Dien", "M. Christina", "Dewi Sartika"], answer: 1 },
            { q: "Peristiwa Rengasdengklok terjadi karena perbedaan pendapat mengenai...", options: ["Tempat Proklamasi", "Waktu Proklamasi", "Tokoh Proklamasi", "Teks Proklamasi"], answer: 1 },
            { q: "Konferensi Meja Bundar (KMB) tahun 1949 di Den Haag menghasilkan...", options: ["Penyerahan Jepang", "Pengakuan Kedaulatan", "Berdirinya ASEAN", "Perjanjian Renville"], answer: 1 },
            { q: "ULTIMATE READY! Dasar negara Indonesia yang dirumuskan pada 1 Juni 1945 adalah...", options: ["UUD 1945", "Piagam Jakarta", "Pancasila", "Bhinneka Tunggal"], answer: 2 }
        ];

        let currentQuestion = 0;
        let playerHP = 100;
        let bossHP = 100;
        let timeLeft = 10;
        let timerInterval;
        let isAnimating = false;

        const bossHpFill = document.getElementById('boss-hp-fill');
        const playerHpFill = document.getElementById('player-hp-fill');
        const playerHpText = document.getElementById('player-hp-text');
        const timerBox = document.getElementById('timer-box');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const playerContainer = document.getElementById('player-container');
        const bossImg = document.getElementById('boss-img');
        const slashFx = document.getElementById('slash-fx');
        const ultiFx = document.getElementById('ulti-fx');
        const battleArena = document.getElementById('battle-arena');
        const overlayScreen = document.getElementById('overlay-screen');

        function startGame() {
            playerHP = 100;
            bossHP = 100;
            currentQuestion = 0;
            updateHP();
            overlayScreen.style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            isAnimating = false;
            const q = questions[currentQuestion];
            questionText.style.color = (currentQuestion === questions.length - 1) ? "#c0392b" : "#222";
            questionText.innerText = q.q;
            optionsGrid.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsGrid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 10;
            timerBox.innerText = timeLeft;
            timerBox.style.color = "#ffea00";

            timerInterval = setInterval(() => {
                if (isAnimating) return;
                timeLeft--;
                timerBox.innerText = timeLeft;
                if (timeLeft <= 3) timerBox.style.color = "#ff4d4d";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    triggerBossAttack("Waktu Habis!");
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex) {
            if (isAnimating) return;
            clearInterval(timerInterval);
            isAnimating = true;

            if (selectedIndex === questions[currentQuestion].answer) {
                triggerPlayerAttack(currentQuestion === questions.length - 1);
            } else {
                triggerBossAttack("Jawaban Salah!");
            }
        }

        function triggerPlayerAttack(isUltimate) {
            playerContainer.classList.add('player-attack');
            setTimeout(() => playerContainer.classList.remove('player-attack'), 300);

            if (isUltimate) {
                ultiFx.classList.add('ultimate-active');
                setTimeout(() => {
                    battleArena.classList.add('shake');
                    bossImg.style.filter = "brightness(3)";
                }, 300);

                setTimeout(() => {
                    ultiFx.classList.remove('ultimate-active');
                    battleArena.classList.remove('shake');
                    bossImg.style.filter = "";
                    bossHP = 0;
                    updateHP();
                    endGame(true);
                }, 1600);
            } else {
                slashFx.classList.add('slash-active');
                bossImg.style.transform = "translateX(12px)";
                bossImg.classList.add('damage-flash');

                setTimeout(() => {
                    slashFx.classList.remove('slash-active');
                    bossImg.style.transform = "";
                    bossImg.classList.remove('damage-flash');
                    bossHP = Math.max(0, bossHP - 25);
                    updateHP();

                    setTimeout(() => {
                        currentQuestion++;
                        loadQuestion();
                    }, 400);
                }, 350);
            }
        }

        function triggerBossAttack(reason) {
            battleArena.classList.add('shake', 'damage-flash');

            setTimeout(() => {
                battleArena.classList.remove('shake', 'damage-flash');
                playerHP = Math.max(0, playerHP - 34);
                updateHP();

                if (playerHP === 0) {
                    setTimeout(() => endGame(false, reason), 400);
                } else {
                    setTimeout(() => {
                        currentQuestion++;
                        if (currentQuestion >= questions.length) {
                            endGame(false, "Kala Corruptus masih bertahan!");
                        } else {
                            loadQuestion();
                        }
                    }, 400);
                }
            }, 350);
        }

        function updateHP() {
            bossHpFill.style.width = bossHP + "%";
            playerHpFill.style.width = playerHP + "%";
            playerHpText.innerText = playerHP + "/100";

            bossHpFill.style.backgroundColor = bossHP <= 30 ? "#e74c3c" : (bossHP <= 60 ? "#f1c40f" : "#2ecc71");
            playerHpFill.style.backgroundColor = playerHP <= 30 ? "#e74c3c" : (playerHP <= 60 ? "#f1c40f" : "#2ecc71");
        }

        function endGame(isWin, reason = "") {
            overlayScreen.style.display = 'flex';
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('start-btn');

            if (isWin) {
                title.innerText = "KALA CORRUPTUS KALAH!";
                title.style.color = "#2ecc71";
                desc.innerText = "Selamat! Melalui ingatan sejarahmu yang tajam, Kala Corruptus berhasil dihancurkan!";
                btn.innerText = "MAIN LAGI";
            } else {
                title.innerText = "SEJARAH RUNTUH...";
                title.style.color = "#e74c3c";
                desc.innerText = reason + " Kamu terjatuh dan garis waktu hancur.";
                btn.innerText = "COBA LAGI";
            }
        }
    </script>
</body>
</html>
